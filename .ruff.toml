target-version = "py310"
line-length = 100
indent-width = 4
extend-exclude = [".venv*", ".uv-cache", ".tool-smoke", ".pytest_tmp", ".pytest-tmp"]

[lint]
select = ["E", "F", "W", "B", "C4", "I", "N", "PGH", "PTH", "RET", "RUF", "SIM", "UP", "YTT"]
ignore = ["RET501"]

[format]
quote-style = "double"
line-ending = "lf"
indent-style = "space"
